name: Package and release

# Fires when a version tag (e.g. 1.4.0) is pushed. The BigWigs packager builds
# the addon per .pkgmeta (a folder named ArcAuras with ArcAuras.toc only),
# uploads it to CurseForge (project read from ArcAuras.toc's X-Curse-Project-ID)
# and Wago (X-Wago-ID), and creates the GitHub release.
#
# WoW FOREVER ONLY: ArcAuras.toc declares Interface 16001 and nothing else, so
# the packager (v2.6.0+) files every upload as game type `forever`: CurseForge
# game 88568, Wago patch 1.60.1. Never pin an older packager: v2.5.1 labels
# 16001 as Retail.
#
# LABEL: the default zip name already ends in {classic} ("-forever"); the
# display label below carries it too, so the file reads ArcAuras-1.4.0-forever.
# Tag with the plain version (1.4.0): the packager adds "-forever" itself
# unless the tag has it.
on:
  push:
    tags:
      - '**'

permissions:
  contents: write   # lets GITHUB_TOKEN create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for version/changelog detection

      - name: Package and release
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: '-n ":{package-name}-{project-version}{classic}"'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}         # CurseForge upload token (repo secret)
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }} # Wago upload (uses ## X-Wago-ID in ArcAuras.toc)
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}     # auto-provided; for the GitHub release
